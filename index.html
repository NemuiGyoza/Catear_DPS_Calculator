<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hornex Cat Ears DPS Calc</title>
<style>
  :root{
    --panel:#151c27; --panel-2:#101720; --line:#28323f;
    --text:#e8eef6; --muted:#8a95a4; --accent:#22d3ee;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1100px 520px at 50% -8%, #1a2536 0%, #0b0f16 62%) fixed;
    color:var(--text); min-height:100vh; padding:16px 16px 48px;
    user-select:none; -webkit-user-select:none;
  }
  input,button{font-family:inherit;}
  input{user-select:text;-webkit-user-select:text;}
  .wrap{max-width:1000px;margin:0 auto;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
  .brand{font-size:22px;font-weight:800;}
  .brand small{font-size:11px;font-weight:700;color:var(--muted);margin-left:8px;letter-spacing:.08em;}
  .rarity-pick{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;}
  .rarity-pick span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
  .rar-btn{background:#1d2735;border:1px solid var(--line);color:var(--text);width:26px;height:26px;border-radius:7px;cursor:pointer;font-weight:800;line-height:1;}
  .rar-btn:hover{background:#26323f;}
  .rar-name{font-weight:800;min-width:74px;text-align:center;}

  .layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-weight:800;}

  .search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:12px;}
  .search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;}

  .palette{display:flex;flex-wrap:wrap;gap:10px;min-height:120px;align-content:flex-start;}
  .pcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    width:88px;height:88px;border-radius:12px;border:2px solid;cursor:grab;
    transition:transform .08s ease,filter .15s;}
  .pcard:hover{transform:translateY(-2px);filter:brightness(1.13);}
  .pcard .ico{line-height:0;}
  .pcard .nm{font-size:12px;font-weight:900;color:#fff;text-shadow:1px 1px 3px rgba(0,0,0,.65);}

  .dps-big{font-size:44px;font-weight:900;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums;word-break:break-all;}
  .dps-unit{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.1em;margin-top:6px;}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
  .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;}
  .stat .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
  .note{color:var(--muted);font-size:11.5px;margin-top:12px;line-height:1.5;}
  .note.warn{color:#fbbf24;}

  .hotbar-row{display:flex;gap:12px;align-items:stretch;margin-top:16px;}
  /* auto-fitting grid: no sideways scroll, wraps + shrinks to fit */
  .hotbar{flex:1 1 auto;min-width:0;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(46px,1fr));
    gap:8px;align-content:center;padding:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;}
  .slot{position:relative;width:100%;aspect-ratio:1/1;border-radius:11px;border:2.5px solid;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:grab;
    transition:transform .08s,filter .12s;}
  .slot:hover{filter:brightness(1.13);}
  .slot.dragover{transform:scale(1.06);outline:2px dashed var(--accent);outline-offset:2px;}
  .slot .num{position:absolute;top:1px;left:5px;font-size:9.5px;font-weight:800;color:rgba(255,255,255,.7);}
  .slot .ico{width:56%;line-height:0;}
  .slot .ico svg{width:100%;height:auto;display:block;}
  .slot .nm{font-size:10.5px;font-weight:900;color:#fff;text-shadow:1px 1px 3px rgba(0,0,0,.65);max-width:100%;overflow:hidden;}
  .slot .x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:1px solid #0006;
    background:#0d1117cc;color:#fff;font-size:11px;line-height:1;cursor:pointer;display:none;padding:0;z-index:5;}
  .slot:hover .x{display:block;}
  .slot.empty{background:var(--panel-2);border:2.5px dashed #3a4553;}
  .slot.empty .nm{display:none;}

  .side{flex:0 0 128px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;
    display:flex;flex-direction:column;gap:8px;align-items:center;}
  .side h2{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;}
  .stepper{display:flex;align-items:center;gap:6px;width:100%;}
  .stepper button{background:#1d2735;border:1px solid var(--line);color:var(--text);border-radius:8px;
    width:30px;height:32px;font-weight:900;cursor:pointer;font-size:15px;flex:0 0 auto;}
  .stepper button:hover{background:#26323f;}
  .stepper input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);text-align:center;font-weight:900;font-size:16px;height:32px;outline:none;
    font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .stepper input:focus{border-color:var(--accent);}

  .hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6;}

  /* tooltip */
  .tt{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s;
    width:262px;background:rgba(9,26,17,.95);border:1px solid rgba(255,255,255,.16);border-radius:9px;
    padding:10px 12px;box-shadow:0 12px 34px rgba(0,0,0,.55);}
  .tt.on{opacity:1;}
  .tt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .tt-name{font-weight:900;font-size:15px;color:#fff;line-height:1.1;}
  .tt-rar{font-size:11.5px;font-weight:800;margin-top:2px;}
  .tt-reload{font-size:12px;font-weight:800;color:#e6edf3;white-space:nowrap;}
  .tt-desc{font-size:11.5px;color:#b9c4cf;margin:9px 0;line-height:1.45;}
  .tt-rows{font-size:11.5px;color:#b9c4cf;line-height:1.65;}
  .tt-rows b{color:#fff;font-weight:800;}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#0f1a24;border:1px solid var(--line);
    color:var(--text);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;}
  .toast.on{opacity:1;transform:translate(-50%,0);}

  @media (max-width:860px){ .layout{grid-template-columns:1fr;} .hotbar-row{flex-direction:column;} .side{flex:0 0 auto;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Hornex Cat Ears DPS Calc<small>rice / ears</small></div>
    <div class="rarity-pick">
      <span>Rarity</span>
      <button class="rar-btn" id="rarDown">&lt;</button>
      <div class="rar-name" id="rarName">Ultra</div>
      <button class="rar-btn" id="rarUp">&gt;</button>
    </div>
  </div>

  <div class="layout">
    <section class="panel">
      <h2>Inventory</h2>
      <div class="search">
        <span style="color:#8a95a4">⌕</span>
        <input id="search" placeholder="Search petals..." />
      </div>
      <div class="palette" id="palette"></div>
      <div class="hint">
        Drag a petal into a slot · hover a petal to see its stats · drag a slot onto another slot to swap ·
        right-click or × to clear a slot.
      </div>
    </section>

    <section class="panel">
      <h2>Cat Ears DPS</h2>
      <div class="dps-big" id="dpsOut">0</div>
      <div class="dps-unit">DAMAGE PER SECOND</div>
      <div class="grid2">
        <div class="stat"><div class="k">Hits / sec</div><div class="v" id="hpsOut">0</div></div>
        <div class="stat"><div class="k">Petals active</div><div class="v" id="activeOut">0</div></div>
        <div class="stat"><div class="k">Rice</div><div class="v" id="riceOut">0</div></div>
        <div class="stat"><div class="k">Ears</div><div class="v" id="earsOut">0</div></div>
      </div>
      <div class="note" id="note">—</div>
    </section>
  </div>

  <div class="hotbar-row">
    <div class="hotbar" id="hotbar"></div>
    <aside class="side">
      <h2>Slots</h2>
      <div class="stepper">
        <button id="slotMinus">−</button>
        <input id="slotInput" type="number" min="1" max="30" value="15" />
        <button id="slotPlus">+</button>
      </div>
    </aside>
  </div>
</div>

<div class="tt" id="tt"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- tuning constants ---------------- */
const RICE_BASE_DMG  = 4;     // Common rice damage
const RARITY_GROWTH  = 3;     // damage x this per rarity tier
const RESPAWN        = 0.02;  // seconds  (20 ms)
const TRAVEL         = 0.05;  // seconds, drop travel latency
const CONTACT_EARS    = 1.0;  // rice uptime with ears equipped
const CONTACT_NO_EARS = 0.5;  // rice uptime without ears

const RARITIES = ["Common","Unusual","Rare","Epic","Legendary","Mythic","Ultra","Super","Hyper"];
const RCOLOR = {
  Common:   ["#7EEF6D","#3D9B33"], // Light Green
  Unusual:  ["#FFE65D","#B39A1F"], // Pastel Yellow
  Rare:     ["#4D52E3","#2A2FA0"], // Royal Blue
  Epic:     ["#861FDE","#55129B"], // Deep Purple
  Legendary:["#DE1F1F","#9A1212"], // Vibrant Red
  Mythic:   ["#1FDBDE","#108A8C"], // Bright Cyan
  Ultra:    ["#FF2B75","#B01049"], // Hot Pink
  Super:    ["#2BFFA3","#10A567"], // Neon Mint Green
  Hyper:    ["#0040FF","#002899"]  // Dark Cyan-Blue / Dark Blue
};

/* petal art (inline svg, no square frames) */
const ICONS = {
  rice:`<svg width="34" height="34" viewBox="0 0 64 64">
      <g transform="rotate(-38 32 32)">
        <rect x="13" y="25.5" width="38" height="13" rx="6.5" fill="#fbfbfd" stroke="#c6ccd5" stroke-width="3"/>
        <rect x="18" y="28.5" width="24" height="3.5" rx="1.75" fill="#eceff3"/>
      </g></svg>`,
  ears:`<svg width="34" height="34" viewBox="0 0 64 64">
      <path d="M9 33 Q32 47 55 33" fill="none" stroke="#1c1c1c" stroke-width="5" stroke-linecap="round"/>
      <path d="M10 34 L17 9 L30 30 Z" fill="#1c1c1c"/>
      <path d="M54 34 L47 9 L34 30 Z" fill="#1c1c1c"/>
      <path d="M16 30 L19.5 15.5 L27 28.5 Z" fill="#f0a3b8"/>
      <path d="M48 30 L44.5 15.5 L37 28.5 Z" fill="#f0a3b8"/></svg>`
};

/* ears = 0 damage, buff only */
const PETALS = {
  ears:{ name:"Ears", dmgMult:0, kind:"buff",
    desc:"Gives you telepathic powers that makes your petals orbit far from the flower." },
  rice:{ name:"Rice", dmgMult:1, kind:"damage",
    desc:"Fast reload but weaker than a fetus. Known as Chawal in Indian." }
};

const state = { rarity:"Ultra", slotCount:15, slots:[], selected:null };

const $ = id => document.getElementById(id);
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 1500);
}
const rIdx = () => RARITIES.indexOf(state.rarity);
const petalDmg = key => PETALS[key].dmgMult * RICE_BASE_DMG * Math.pow(RARITY_GROWTH, rIdx());
const earsRange = () => Math.max(1, Math.round(470 * Math.pow(3, rIdx() - 6)));
const fmt = n => Math.round(n).toLocaleString();
const fmtDec = n => n.toLocaleString(undefined,{maximumFractionDigits:2});

function initSlots(){ state.slots = Array(state.slotCount).fill(null); }

/* ---------------- tooltip ---------------- */
const tt = $("tt");
function moveTip(e){
  const pad = 16, r = tt.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if(x + r.width  > innerWidth  - 8) x = e.clientX - r.width  - pad;
  if(y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tt.style.left = Math.max(8,x) + "px";
  tt.style.top  = Math.max(8,y) + "px";
}
function showTip(e, key){
  const p = PETALS[key];
  const rows = key === "rice"
    ? `<div>Damage: <b>${fmt(petalDmg("rice"))}</b></div><div>Health: <b>${fmt(petalDmg("rice")/4)}</b></div>`
    : `<div>Range: <b>${fmt(earsRange())}</b></div>`;
  tt.innerHTML = `
    <div class="tt-top">
      <div>
        <div class="tt-name">${p.name}</div>
        <div class="tt-rar" style="color:${RCOLOR[state.rarity][0]}">${state.rarity}</div>
      </div>
      <div class="tt-reload">${fmtDec(RESPAWN)}s ⟳</div>
    </div>
    <div class="tt-desc">${p.desc}</div>
    <div class="tt-rows">${rows}</div>`;
  tt.classList.add("on");
  moveTip(e);
}
function hideTip(){ tt.classList.remove("on"); }
function bindTip(el, key){
  el.addEventListener("mouseenter", e => showTip(e, key));
  el.addEventListener("mousemove", moveTip);
  el.addEventListener("mouseleave", hideTip);
}

/* ---------------- inventory (petals stay here) ---------------- */
function renderPalette(){
  const q = $("search").value.trim().toLowerCase();
  const [c,b] = RCOLOR[state.rarity];
  const pal = $("palette"); pal.innerHTML = "";
  Object.keys(PETALS).forEach(key=>{
    const p = PETALS[key];
    if(q && !p.name.toLowerCase().includes(q)) return;
    const el = document.createElement("div");
    el.className = "pcard" + (state.selected===key ? " selected" : "");
    el.draggable = true;
    el.style.background = c; el.style.borderColor = b;
    el.innerHTML = `<div class="ico">${ICONS[key]}</div><div class="nm">${p.name}</div>`;
    el.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/plain","p:"+key);
      e.dataTransfer.effectAllowed = "copy";
    });
    el.addEventListener("click", ()=>{ state.selected = state.selected===key ? null : key; renderPalette(); });
    bindTip(el, key);
    pal.appendChild(el);
  });
}

/* ---------------- slots ---------------- */
function renderHotbar(){
  const hb = $("hotbar"); hb.innerHTML = "";
  const [c,b] = RCOLOR[state.rarity];
  state.slots.forEach((key,i)=>{
    const el = document.createElement("div");
    el.className = "slot" + (key ? "" : " empty");
    el.draggable = true;
    if(key){
      el.style.background = c; el.style.borderColor = b;
      el.innerHTML = `<span class="num">${i+1}</span><button class="x" title="remove">×</button>
        <div class="ico">${ICONS[key]}</div><div class="nm">${PETALS[key].name}</div>`;
      bindTip(el, key);
    } else {
      el.style.borderColor = "#3a4553";
      el.innerHTML = `<span class="num">${i+1}</span><button class="x" title="remove">×</button>`;
    }
    el.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/plain","s:"+i);
      e.dataTransfer.effectAllowed = "move";
    });
    el.addEventListener("dragover", e=>{ e.preventDefault(); el.classList.add("dragover"); });
    el.addEventListener("dragleave", ()=> el.classList.remove("dragover"));
    el.addEventListener("drop", e=>{
      e.preventDefault(); el.classList.remove("dragover");
      const d = e.dataTransfer.getData("text/plain");
      if(d.startsWith("p:")) state.slots[i] = d.slice(2);
      else if(d.startsWith("s:")){
        const j = +d.slice(2);
        const tmp = state.slots[i]; state.slots[i] = state.slots[j]; state.slots[j] = tmp;
      }
      render();
    });
    el.addEventListener("click", e=>{
      if(e.target.classList.contains("x")){ state.slots[i] = null; render(); return; }
      state.slots[i] = state.selected ? state.selected : null;
      render();
    });
    el.addEventListener("contextmenu", e=>{ e.preventDefault(); state.slots[i]=null; render(); });
    hb.appendChild(el);
  });
}

$("palette").addEventListener("dragover", e=>e.preventDefault());
$("palette").addEventListener("drop", e=>{
  e.preventDefault();
  const d = e.dataTransfer.getData("text/plain");
  if(d.startsWith("s:")){ state.slots[+d.slice(2)] = null; render(); }
});

/* ---------------- calc (unchanged) ---------------- */
function calc(){
  const cycle = Math.max(0.001, RESPAWN + TRAVEL);
  const rice = state.slots.filter(k=>k==="rice").length;
  const ears = state.slots.filter(k=>k==="ears").length;
  const contact = ears > 0 ? CONTACT_EARS : CONTACT_NO_EARS;
  const hps = rice / cycle;
  return { rice, ears, hps, dps: hps * petalDmg("rice") * contact };
}

function render(){
  renderPalette(); renderHotbar();
  const { rice, ears, hps, dps } = calc();
  $("dpsOut").textContent = dps >= 1000 ? fmt(dps) : fmtDec(dps);
  $("hpsOut").textContent = fmtDec(hps);
  $("activeOut").textContent = state.slots.filter(Boolean).length;
  $("riceOut").textContent = rice;
  $("earsOut").textContent = ears;
  $("rarName").textContent = state.rarity;
  $("rarName").style.color = RCOLOR[state.rarity][0];

  const note = $("note");
  if(!rice && !ears){
    note.classList.remove("warn");
    note.textContent = "Slots start empty — drag petals in from the inventory to build.";
  } else if(ears > 0){
    note.classList.remove("warn");
    note.textContent = "Ears equipped: orbit stays parked on the mob, rice keeps full contact. Ears deals 0 damage.";
  } else {
    note.classList.add("warn");
    note.textContent = "No ears in the build: rice swings back between hits, so only partial contact.";
  }
}

/* ---------------- slot count ---------------- */
function setSlotCount(n, sync){
  n = Math.max(1, Math.min(30, Math.round(n)));
  const old = state.slots.slice();
  state.slotCount = n;
  state.slots = Array.from({length:n},(_,i)=> old[i] !== undefined ? old[i] : null);
  if(sync) $("slotInput").value = n;
  render();
}
$("slotPlus").onclick  = ()=> setSlotCount(state.slotCount + 1, true);
$("slotMinus").onclick = ()=> setSlotCount(state.slotCount - 1, true);
$("slotInput").addEventListener("input", e=>{
  const v = parseInt(e.target.value, 10);
  if(!isNaN(v)) setSlotCount(v, false);
});
$("slotInput").addEventListener("blur", ()=> setSlotCount(state.slotCount, true));

/* ---------------- rarity ---------------- */
$("rarUp").onclick   = ()=>{ state.rarity = RARITIES[Math.min(RARITIES.length-1, rIdx()+1)]; render(); };
$("rarDown").onclick = ()=>{ state.rarity = RARITIES[Math.max(0, rIdx()-1)]; render(); };
$("search").addEventListener("input", renderPalette);

initSlots();
render();
</script>
</body>
</html>
